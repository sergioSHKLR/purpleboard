# Tests, builds and publishes the site (homepage + bench app) to GitHub Pages on every push to main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # where the in-app feedback form sends mail (address or FormSubmit alias); set it under
          # Settings → Secrets and variables → Actions → Variables. Unset: GitHub issues only.
          VITE_FEEDBACK_TO: ${{ vars.FEEDBACK_TO }}
          # Umami Cloud website id for visitor + active-time analytics (website only, see
          # src/analytics.ts). Unset: no analytics.
          VITE_UMAMI_ID: ${{ vars.UMAMI_ID }}
          # DEADBOARD's own anonymous puzzle statistics (website only, see src/attempts/ and
          # collector/README.md), e.g. https://stats.deadboard.org/v1/attempt. Unset: nothing sent.
          VITE_ATTEMPTS_URL: ${{ vars.ATTEMPTS_URL }}
          # mod.io: the game's id and read-only API key (both public by design: they ship in the
          # page) and, optionally, its API path. Unset: no mod.io tab. See src/mods/modio.ts.
          VITE_MODIO_GAME_ID: ${{ vars.MODIO_GAME_ID }}
          VITE_MODIO_API_KEY: ${{ vars.MODIO_API_KEY }}
          VITE_MODIO_API_URL: ${{ vars.MODIO_API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
