<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="none" stroke="#111" stroke-width="2">
  <rect x="0" y="0" width="640" height="360" fill="#fff" stroke="none"/>
  <text x="20" y="30" fill="#111" stroke="none" font-size="18" font-weight="bold">NIGHT LIGHT · REV A</text>
  <text x="20" y="50" fill="#555" stroke="none" font-size="12">Example schematic from the DEADBOARD starter-kit mod</text>
  <!-- battery BT1 -->
  <path d="M80 120 V170 M60 170 H100 M70 180 H90 M60 190 H100 M70 200 H90 M80 200 V290"/>
  <text x="108" y="182" fill="#111" stroke="none">BT1</text><text x="108" y="200" fill="#111" stroke="none">2×AA 3 V</text>
  <text x="62" y="165" fill="#111" stroke="none" font-size="12">+</text>
  <!-- VBAT to switch -->
  <path d="M80 120 H180"/>
  <text x="100" y="112" fill="#0a6" stroke="none" font-size="12">VBAT</text>
  <!-- switch SW1 -->
  <circle cx="185" cy="120" r="4" fill="#111"/><circle cx="235" cy="120" r="4" fill="#111"/>
  <path d="M185 120 L232 100 M210 92 V108"/>
  <text x="195" y="150" fill="#111" stroke="none">SW1</text>
  <path d="M239 120 H300"/>
  <text x="250" y="112" fill="#0a6" stroke="none" font-size="12">SW</text>
  <!-- R1 and R2 (DNP) in parallel -->
  <path d="M300 120 V90 H330 M390 90 H420 V120 M300 120 V150 H330 M390 150 H420 V120"/>
  <rect x="330" y="80" width="60" height="20"/><text x="345" y="72" fill="#111" stroke="none">R1 68 Ω</text>
  <rect x="330" y="140" width="60" height="20" stroke-dasharray="5 4"/><text x="333" y="182" fill="#111" stroke="none">R2 22 Ω · DNP</text>
  <!-- LED D1 -->
  <path d="M420 120 H500 V170"/>
  <text x="440" y="112" fill="#0a6" stroke="none" font-size="12">LED_A</text>
  <path d="M480 170 H520 L500 205 Z M480 205 H520 M500 205 V290"/>
  <path d="M528 178 l14 -10 M534 190 l14 -10" stroke-width="1.5"/>
  <text x="530" y="220" fill="#111" stroke="none">D1 red LED</text>
  <!-- ground -->
  <path d="M80 290 H500"/>
  <path d="M280 290 V300 M265 300 H295 M271 306 H289 M277 312 H283"/>
  <text x="300" y="285" fill="#0a6" stroke="none" font-size="12">GND</text>
</svg>
