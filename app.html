  <body style="margin:0;background:#090c0a">

    <div id="app"><div class="boot" aria-label="Loading DEADBOARD" style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#aeb9b1;font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em">

    </div></div>
    <script type="module" src="/src/main.ts"></script>
