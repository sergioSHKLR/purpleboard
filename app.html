<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DEADBOARD — board-level repair trainer</title>
    <meta name="description" content="Bring dead boards back. Diagnose and repair simulated circuit boards on a realistic bench — multimeter, scope, bench supply, thermal camera and rework — then crack repair challenges." />
    <meta name="theme-color" content="#090c0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- phones: home-screen icon and full-screen launch (the web manifest is added by the mobile layout) -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DEADBOARD" />
  </head>
  <body style="margin:0;background:#090c0a">
    <!-- shown until the app replaces it: the bundle takes a few seconds on a slow phone connection -->
    <div id="app"><div class="boot" aria-label="Loading DEADBOARD" style="height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#aeb9b1;font:600 13px/1 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.3em">
      <span>DEADBOARD</span>
      <span style="display:block;width:120px;height:2px;background:#222a25;overflow:hidden;border-radius:1px"><i style="display:block;width:40%;height:100%;background:#4be38a;animation:boot 1.1s ease-in-out infinite alternate"></i></span>
      <style>@keyframes boot { from { transform: translateX(-100%) } to { transform: translateX(250%) } } @media (prefers-reduced-motion: reduce) { .boot i { animation: none !important } }</style>
    </div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
