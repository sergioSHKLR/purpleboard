# DEADBOARD puzzle-statistics collector (see README.md). Deploy: npx wrangler deploy
name = "deadboard-stats"
main = "worker.ts"
compatibility_date = "2026-06-01"
workers_dev = false
routes = [{ pattern = "stats.deadboard.org", custom_domain = true }]

[vars]
ALLOWED_ORIGIN = "https://deadboard.org"
# records per UTC day at most (D1 free plan: 100k rows written per day; one record writes ~5 rows
# with its indexes and the day counter; above the limit D1 fails until midnight UTC)
DAILY_CAP = "15000"

[[d1_databases]]
binding = "DB"
database_name = "deadboard-attempts"
# created with --jurisdiction=eu (data stays in the EU; see README.md)
database_id = "d444f252-622b-4ed9-9f67-c102c058450a"

[triggers]
# 03:17 UTC: upkeep (tokens, expiry) + summary; every 6 hours: the public summary (stats.html)
crons = ["17 3 * * *", "47 */6 * * *"]

# no request logs: nothing about a request (IP, headers) is kept anywhere
[observability]
enabled = false
